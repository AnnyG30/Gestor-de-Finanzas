<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${titulo}">Formulario Gasto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h1 th:text="${titulo}">Formulario de Gasto</h1>

  <!-- Mensajes de error -->
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <form th:action="@{/gastos/add}" method="post" th:object="${gasto}">

    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción *</label>
      <input type="text" class="form-control" id="descripcion" th:field="*{descripcion}" required>
    </div>

    <div class="mb-3">
      <label for="monto" class="form-label">Monto *</label>
      <input type="number" step="0.01" class="form-control" id="monto" th:field="*{monto}" required>
    </div>

    <!-- CAMBIADO: fechaIngreso → fechaGasto -->
    <div class="mb-3">
      <label for="fechaGasto" class="form-label">Fecha *</label>
      <input type="datetime-local" class="form-control" id="fechaGasto" th:field="*{fechaGasto}" required>
    </div>

    <div class="mb-3">
      <label for="categoria" class="form-label">Categoría</label>
      <input type="text" class="form-control" id="categoria" th:field="*{categoria}">
    </div>

    <!-- Campo oculto para idUsuario -->
    <input type="hidden" th:field="*{idUsuario}" value="1">

    <button type="submit" class="btn btn-success">Guardar Gasto</button>
    <a th:href="@{/gastos}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>

<script>
  // Establecer fecha y hora actual por defecto
  document.addEventListener('DOMContentLoaded', function() {
    const fechaInput = document.getElementById('fechaGasto');
    if (!fechaInput.value) {
      const now = new Date();
      // Formato: YYYY-MM-DDTHH:MM
      const localDateTime = now.toISOString().slice(0, 16);
      fechaInput.value = localDateTime;
    }
  });
</script>
</body>
</html>
