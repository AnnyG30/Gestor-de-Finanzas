<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista de Gastos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <h2 class="mb-4 text-center">Lista de Gastos</h2>

  <div class="text-end mb-3">
    <a href="/gastos/add" class="btn btn-primary">+ Nuevo Gasto</a>
    <a href="/dashboard" class="btn btn-secondary">Volver al Dashboard</a>
  </div>

  <table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Fecha</th>
      <th>Categoría</th>
      <th>Monto (€)</th>
      <th>Descripción</th>
      <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="gasto : ${gastos}">
      <td th:text="${gasto.idGasto}"></td>
      <td th:text="${gasto.fechaGasto}"></td>
      <td th:text="${gasto.categoria}"></td>
      <td th:text="${gasto.monto}"></td>
      <td th:text="${gasto.descripcion}"></td>
      <td>
        <a th:href="@{/gastos/edit/{id}(id=${gasto.idGasto})}" class="btn btn-sm btn-warning">Editar</a>
        <a th:href="@{/gastos/delete/{id}(id=${gasto.idGasto})}" class="btn btn-sm btn-danger">Eliminar</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
