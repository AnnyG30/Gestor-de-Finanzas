<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista de Ingresos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <h2 class="mb-4 text-center">Lista de Ingresos</h2>

  <div class="text-end mb-3">
    <a href="/ingresos/add" class="btn btn-primary">+ Nuevo Ingreso</a>
    <a href="/dashboard" class="btn btn-secondary">Volver al Dashboard</a>
  </div>

  <table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Fecha</th>
      <th>Categoría</th>
      <th>Monto (€)</th>
      <th>Descripción</th>
      <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ingreso : ${ingresos}">
      <td th:text="${ingreso.idIngreso}"></td>
      <td th:text="${#dates.format(ingreso.fechaIngreso, 'dd/MM/yyyy HH:mm')}"></td>
      <td th:text="${ingreso.categoria}"></td>
      <td th:text="${ingreso.monto}"></td>
      <td th:text="${ingreso.descripcion}"></td>
      <td>
        <a th:href="@{/ingresos/edit/{id}(id=${ingreso.idIngreso})}" class="btn btn-sm btn-warning">Editar</a>
        <a th:href="@{/ingresos/delete/{id}(id=${ingreso.idIngreso})}" class="btn btn-sm btn-danger">Eliminar</a>
      </td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
