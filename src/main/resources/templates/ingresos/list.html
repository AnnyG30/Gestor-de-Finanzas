<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lista de Ingresos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h1>Lista de Ingresos</h1>

  <!-- Mensajes de éxito/error -->
  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="mb-3">
    <a th:href="@{/ingresos/add}" class="btn btn-primary">+ Nuevo Ingreso</a>
    <a th:href="@{/dashboard}" class="btn btn-secondary">Volver al Dashboard</a>
  </div>

  <table class="table table-striped table-bordered">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Fecha</th>
      <th>Categoría</th>
      <th>Monto (€)</th>
      <th>Descripción</th>
      <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ingreso : ${ingresos}">
      <td th:text="${ingreso.idIngreso}"></td>
      <td th:text="${#temporals.format(ingreso.fechaIngreso, 'dd/MM/yyyy HH:mm')}"></td>
      <td th:text="${ingreso.categoria}"></td>
      <td th:text="${'€' + #numbers.formatDecimal(ingreso.monto, 1, 'COMMA', 2, 'POINT')}"></td>
      <td th:text="${ingreso.descripcion}"></td>
      <td>
        <a th:href="@{/ingresos/edit/{id}(id=${ingreso.idIngreso})}" class="btn btn-sm btn-warning">Editar</a>
        <a th:href="@{/ingresos/delete/{id}(id=${ingreso.idIngreso})}" class="btn btn-sm btn-danger">Eliminar</a>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- Mensaje cuando no hay ingresos -->
  <div th:if="${ingresos == null or ingresos.empty}" class="alert alert-info text-center">
    <p>No hay ingresos registrados</p>
    <a th:href="@{/ingresos/add}" class="btn btn-primary">Agregar Primer Ingreso</a>
  </div>
</div>
</body>
</html>
