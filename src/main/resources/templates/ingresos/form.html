<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${titulo}">Formulario Gasto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <h2 class="mb-4 text-center" th:text="${titulo}"></h2>

  <form th:action="@{/gastos/save}" th:object="${gasto}" method="post" class="border p-4 bg-white shadow rounded">
    <div class="mb-3">
      <label class="form-label">Categoría</label>
      <input type="text" th:field="*{categoria}" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Monto (€)</label>
      <input type="number" step="0.01" th:field="*{monto}" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Descripción</label>
      <input type="text" th:field="*{descripcion}" class="form-control">
    </div>

    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="/gastos" class="btn btn-secondary">Cancelar</a>
  </form>
</div>

</body>
</html>
