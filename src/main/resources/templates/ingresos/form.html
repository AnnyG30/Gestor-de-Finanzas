<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${titulo}">Formulario Ingreso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h1 th:text="${titulo}">Formulario de Ingreso</h1>

  <!-- Mensajes de éxito/error -->
  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <!-- FORMULARIO DINÁMICO: funciona para ADD y EDIT -->
  <form th:action="${ingreso.idIngreso != null} ?
                   @{/ingresos/edit/{id}(id=${ingreso.idIngreso})} :
                   @{/ingresos/add}"
        method="post" th:object="${ingreso}" enctype="multipart/form-data">

    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción *</label>
      <input type="text" class="form-control" id="descripcion" th:field="*{descripcion}" required>
    </div>

    <div class="mb-3">
      <label for="monto" class="form-label">Monto (€) *</label>
      <input type="number" step="0.01" min="0.01" class="form-control" id="monto" th:field="*{monto}" required>
    </div>

    <div class="mb-3">
      <label for="fechaIngreso" class="form-label">Fecha *</label>
      <input type="datetime-local" class="form-control" id="fechaIngreso" th:field="*{fechaIngreso}" required>
    </div>

    <div class="mb-3">
      <label for="categoria" class="form-label">Categoría</label>
      <input type="text" class="form-control" id="categoria" th:field="*{categoria}" placeholder="Ej: Salario, Ventas, Inversiones...">
    </div>

    <!-- NUEVO: Campo para subir archivo -->
    <div class="mb-3">
      <label for="file" class="form-label">Adjuntar archivo (opcional)</label>
      <input type="file" class="form-control" id="file" name="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx,.xls,.xlsx">
      <div class="form-text">Formatos permitidos: PDF, imágenes, documentos Word/Excel</div>
    </div>

    <!-- Campo oculto para idUsuario -->
    <input type="hidden" th:field="*{idUsuario}">

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-success">
        <span th:text="${ingreso.idIngreso != null} ? 'Actualizar' : 'Guardar'">Guardar</span> Ingreso
      </button>
      <a th:href="@{/ingresos}" class="btn btn-secondary">Cancelar</a>
    </div>
  </form>
</div>

<script src="../js/fechaIngreso.js">
</script>
</body>
</html>
